<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="78%">
      <stop offset="0%" stop-color="#7a4a25"/>
      <stop offset="55%" stop-color="#4a2818"/>
      <stop offset="100%" stop-color="#1f0d06"/>
    </radialGradient>

    <linearGradient id="worm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C5E27A"/>
      <stop offset="45%" stop-color="#8BC34A"/>
      <stop offset="100%" stop-color="#4F7C1F"/>
    </linearGradient>

    <linearGradient id="wormDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8BC34A"/>
      <stop offset="100%" stop-color="#3F6614"/>
    </linearGradient>

    <radialGradient id="eyeBall" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfd6c0"/>
    </radialGradient>

    <linearGradient id="book" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E74C3C"/>
      <stop offset="100%" stop-color="#8E2A1F"/>
    </linearGradient>

    <linearGradient id="pages" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8DC"/>
      <stop offset="100%" stop-color="#D4BC7A"/>
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.55)"/>
    </radialGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1024" height="1024" rx="225" fill="url(#bg)"/>

  <!-- Floor shadow -->
  <ellipse cx="512" cy="930" rx="380" ry="35" fill="rgba(0,0,0,0.4)"/>

  <!-- Decorative floating letter tiles in corners -->
  <g opacity="0.16">
    <g transform="translate(140 180) rotate(-15)">
      <rect x="-55" y="-55" width="110" height="110" rx="16" fill="#e8d4a2"/>
      <text x="0" y="22" font-family="Georgia, serif" font-size="78" font-weight="bold" fill="#3a2a0a" text-anchor="middle">A</text>
    </g>
    <g transform="translate(880 220) rotate(12)">
      <rect x="-55" y="-55" width="110" height="110" rx="16" fill="#e8d4a2"/>
      <text x="0" y="22" font-family="Georgia, serif" font-size="78" font-weight="bold" fill="#3a2a0a" text-anchor="middle">Z</text>
    </g>
  </g>

  <!-- WORM TAIL -->
  <g filter="url(#dropShadow)">
    <path d="M 260 880
             C 160 880, 150 750, 280 710
             C 410 670, 440 620, 450 560
             C 458 490, 478 440, 490 400"
          stroke="url(#worm)" stroke-width="160" fill="none" stroke-linecap="round"/>
    <g stroke="#3F6614" stroke-width="4" fill="none" opacity="0.55">
      <path d="M 220 850 Q 270 820 320 850"/>
      <path d="M 200 770 Q 255 740 310 770"/>
      <path d="M 240 700 Q 305 678 370 700"/>
      <path d="M 370 660 Q 415 638 460 660"/>
      <path d="M 430 580 Q 465 562 500 580"/>
    </g>
  </g>

  <!-- HEAD -->
  <g filter="url(#dropShadow)">
    <circle cx="510" cy="320" r="195" fill="url(#worm)" stroke="#355218" stroke-width="7"/>
    <ellipse cx="460" cy="235" rx="95" ry="48" fill="rgba(255,255,255,0.38)"/>
    <ellipse cx="370" cy="360" rx="32" ry="18" fill="#F08AA0" opacity="0.4"/>
    <ellipse cx="650" cy="360" rx="32" ry="18" fill="#F08AA0" opacity="0.4"/>
  </g>

  <!-- LEFT EYE -->
  <g>
    <circle cx="430" cy="295" r="70" fill="url(#eyeBall)" stroke="#111" stroke-width="7"/>
    <circle cx="446" cy="305" r="28" fill="#111"/>
    <circle cx="438" cy="295" r="11" fill="#fff"/>
    <circle cx="458" cy="316" r="5" fill="#fff" opacity="0.7"/>
  </g>

  <!-- RIGHT EYE -->
  <g>
    <circle cx="590" cy="295" r="70" fill="url(#eyeBall)" stroke="#111" stroke-width="7"/>
    <circle cx="606" cy="305" r="28" fill="#111"/>
    <circle cx="598" cy="295" r="11" fill="#fff"/>
    <circle cx="618" cy="316" r="5" fill="#fff" opacity="0.7"/>
  </g>

  <!-- FRIENDLY SMILE -->
  <g>
    <path d="M 430 395 Q 510 470 590 395"
          stroke="#111" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M 488 432 L 488 452 L 510 452 L 510 432 Z"
          fill="#fff" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- BOW TIE -->
  <g filter="url(#softShadow)">
    <path d="M 510 520 L 425 475 L 425 575 L 510 540 Z" fill="url(#book)" stroke="#5C1A12" stroke-width="5"/>
    <path d="M 510 520 L 595 475 L 595 575 L 510 540 Z" fill="url(#book)" stroke="#5C1A12" stroke-width="5"/>
    <rect x="495" y="503" width="30" height="50" rx="5" fill="#8E2A1F" stroke="#5C1A12" stroke-width="4"/>
    <path d="M 440 488 L 495 510" stroke="rgba(255,255,255,0.5)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 580 488 L 525 510" stroke="rgba(255,255,255,0.5)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- BOOK -->
  <g filter="url(#dropShadow)">
    <path d="M 330 690 L 720 690 L 730 720 L 340 720 Z" fill="url(#pages)" stroke="#A08850" stroke-width="2"/>
    <g stroke="#A08850" stroke-width="1.5" opacity="0.6">
      <line x1="340" y1="700" x2="725" y2="700"/>
      <line x1="340" y1="708" x2="725" y2="708"/>
      <line x1="340" y1="715" x2="725" y2="715"/>
    </g>
    <rect x="320" y="700" width="410" height="180" rx="8" fill="#3D110A"/>
    <rect x="325" y="685" width="400" height="190" rx="10" fill="url(#book)" stroke="#3D110A" stroke-width="6"/>
    <rect x="345" y="705" width="360" height="150" rx="6"
          fill="none" stroke="#F1C40F" stroke-width="4" opacity="0.8"/>
    <text x="525" y="820" font-family="Georgia, serif" font-size="135" font-weight="bold"
          fill="#F1C40F" text-anchor="middle"
          stroke="#3D110A" stroke-width="4">W</text>
    <circle cx="395" cy="780" r="6" fill="#F1C40F" opacity="0.7"/>
    <circle cx="655" cy="780" r="6" fill="#F1C40F" opacity="0.7"/>
  </g>

  <!-- HANDS -->
  <g filter="url(#softShadow)">
    <ellipse cx="345" cy="745" rx="42" ry="35" fill="url(#wormDark)" stroke="#2D4D14" stroke-width="5"/>
    <ellipse cx="338" cy="735" rx="22" ry="14" fill="rgba(255,255,255,0.35)"/>
    <ellipse cx="705" cy="745" rx="42" ry="35" fill="url(#wormDark)" stroke="#2D4D14" stroke-width="5"/>
    <ellipse cx="698" cy="735" rx="22" ry="14" fill="rgba(255,255,255,0.35)"/>
  </g>

  <!-- SPARKLES -->
  <g opacity="0.9">
    <g transform="translate(720 200)">
      <path d="M 0 -32 L 8 -8 L 32 0 L 8 8 L 0 32 L -8 8 L -32 0 L -8 -8 Z" fill="#F1C40F"/>
      <circle r="7" fill="#FFF8DC"/>
    </g>
    <g transform="translate(790 320) scale(0.55)">
      <path d="M 0 -32 L 8 -8 L 32 0 L 8 8 L 0 32 L -8 8 L -32 0 L -8 -8 Z" fill="#F1C40F"/>
    </g>
    <g transform="translate(270 360) scale(0.7)">
      <path d="M 0 -32 L 8 -8 L 32 0 L 8 8 L 0 32 L -8 8 L -32 0 L -8 -8 Z" fill="#F1C40F"/>
    </g>
    <g transform="translate(820 480) scale(0.5)">
      <path d="M 0 -32 L 8 -8 L 32 0 L 8 8 L 0 32 L -8 8 L -32 0 L -8 -8 Z" fill="#F1C40F"/>
    </g>
  </g>

  <rect width="1024" height="1024" rx="225" fill="url(#vignette)" pointer-events="none"/>
</svg>
